services:
  ollama:
    image: ollama/ollama:latest
    profiles: ["assistant"]
    container_name: fabric-stock-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  whisper:
    build:
      context: ./assistant-services/whisper
    profiles: ["assistant"]
    container_name: fabric-stock-whisper
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-4}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - whisper_models:/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s

  postgres:
    image: postgres:15
    container_name: fabric-stock-db
    restart: always
    environment:
      POSTGRES_DB: fabric_stock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
  ollama_data:
  whisper_models:
